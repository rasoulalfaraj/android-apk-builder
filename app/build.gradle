plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt' // ضروري لعمل Room
}

android {
    namespace 'com.example.waterweather' // تأكد أن هذا يطابق اسم حزمتك
    compileSdk 34

    defaultConfig {
        applicationId "com.example.waterweather"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true // تفعيل Jetpack Compose
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // مكتبات Jetpack Compose الأساسية
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.2'

    // WorkManager (للتنبيهات)
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // Retrofit (لجلب الطقس)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // Room (لحفظ سجل الشرب)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1' // استخدم kapt لأن المشروع قديم

    // Lifecycle (لـ ViewModel)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
}